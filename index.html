<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Color Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/themes/light.css" />
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/shoelace-autoloader.js"></script>
  <script src="main.js" defer></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    body {
      font-family: 'Google Sans Flex', sans-serif;
      min-height: 100vh;
      display: flex;
    }
  </style>
</head>

<body>
  <color-picker>
    <color-selection></color-selection>
    <color-converter>
      <color-converter-input type="HEX"></color-converter-input>
      <color-converter-input type="RGB255"></color-converter-input>
      <color-converter-input type="RGB01"></color-converter-input>
      <color-converter-input type="HSV"></color-converter-input>
      <color-converter-input type="HSL"></color-converter-input>
    </color-converter>
    <image-sampling></image-sampling>
    <color-interpolation></color-interpolation>
    <color-maps></color-maps>
    <other-tools>
      <a href="https://coolors.co/app" target="_blank">Coolors.co</a>
      <a href="http://colorbrewer2.org/" target="_blank">Colorbrewer2.org</a>
      <a href="https://m2.material.io/resources/color/" target="_blank">Material Color Tool</a>
      <a href="https://refactoringui.com/previews/building-your-color-palette/" target="_blank">Refactoring GUI: Building Your Color Palette</a>
    </other-tools>
  </color-picker>
</body>

</html>

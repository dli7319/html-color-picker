<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Color Picker</title>
  <meta name="theme-color" content="#475569" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preload" href="./fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/material-symbols-outlined-subset.woff2" as="font" type="font/woff2" crossorigin />
  <link href="./fonts.css" rel="stylesheet">
  <script src="main.js" defer></script>
  <script>
    // Pre-paint the saved color so returning users don't get a white flash.
    try {
      var saved = JSON.parse(localStorage.getItem("last-active-color") || "null");
      if (saved) {
        document.documentElement.style.setProperty("--pre-paint-bg", "#" + saved);
      }
    } catch (e) {}
  </script>
  <style>
    :root {
      --motion-fast: 120ms;
      --motion-base: 180ms;
      --motion-slow: 260ms;
      --ease-out: cubic-bezier(0.2, 0, 0, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      /* Handles track 1:1 during drags (see body.dragging below). */
      --handle-transition: top var(--motion-base) var(--ease-out),
        left var(--motion-base) var(--ease-out);
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      body {
        transition: none !important;
      }
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    body {
      background: var(--pre-paint-bg, #475569);
      transition: background-color 500ms var(--ease-out);
    }
    body.dragging {
      transition: none;
      --handle-transition: none;
    }
    body {
      font-family: 'Google Sans Flex', sans-serif;
      min-height: 100vh;
      display: flex;
    }
  </style>
</head>

<body>
  <color-picker updatebodybackground>
    <color-selection></color-selection>
    <color-converter>
      <color-converter-input type="HEX"></color-converter-input>
      <color-converter-input type="RGB255"></color-converter-input>
      <color-converter-input type="RGB01"></color-converter-input>
      <color-converter-input type="HSV"></color-converter-input>
      <color-converter-input type="HSL"></color-converter-input>
    </color-converter>
    <image-sampling></image-sampling>
    <color-interpolation></color-interpolation>
    <color-maps></color-maps>
    <color-palette></color-palette>
    <color-history></color-history>
    <other-tools>
      <a href="https://coolors.co/app" target="_blank">Coolors.co</a>
      <a href="http://colorbrewer2.org/" target="_blank">Colorbrewer2.org</a>
      <a href="https://m2.material.io/resources/color/" target="_blank">Material Color Tool</a>
      <a href="https://refactoringui.com/previews/building-your-color-palette/" target="_blank">Refactoring GUI: Building Your Color Palette</a>
    </other-tools>
  </color-picker>
</body>

</html>
